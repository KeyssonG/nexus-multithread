# Common RabbitMQ
spring.rabbitmq.host=${HOST_RABBIT:rabbitmq}
spring.rabbitmq.port=${PORT_RABBIT:5672}
spring.rabbitmq.username=${USER_RABBIT:admin}
spring.rabbitmq.password=${PASSWORD_RABBIT:admin123}

# Common Redis
spring.data.redis.host=${HOST_REDIS:localhost}
spring.data.redis.port=${PORT_REDIS:6379}

# Common SMTP (valores esperados do configmap/secrets k8s)
spring.mail.host=${HOST_SMTP:smtp.gmail.com}
spring.mail.port=${PORT_SMTP:587}
spring.mail.username=${USER_SMTP:multithreadteam@gmail.com}
spring.mail.password=${PASSWORD_SMTP:wgtk vywp igny zcki}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Common Config
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# Logging (controlado por logback-spring.xml)

# Desabilita a geracao automatica de senha do Spring Security (warning desnecessario)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# Compression (GZip)
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain
server.compression.min-response-size=1024

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.pool-name=nexus-hikari-pool
spring.datasource.hikari.auto-commit=false

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# Startup logging
logging.level.keysson.nexus=INFO
