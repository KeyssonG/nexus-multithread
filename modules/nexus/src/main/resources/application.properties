# Import local configuration if available
spring.config.import=optional:application-local.properties

server.port=${SERVER_PORT:8088}

# Common Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/managerPROD}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgresql}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

