# Import local configuration if available
spring.config.import=optional:application-local.properties

server.port=8085

# Common Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/managerPROD}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgresql}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JWT Config
jwt.secret=${SECRET_KEY:C6slIxtVM5y1mBrCphrqygYNVoN7t5V/03NVfJddayQ=}

# Common RabbitMQ
spring.rabbitmq.host=${HOST_RABBIT:localhost}
spring.rabbitmq.port=${PORT_RABBIT:5672}
spring.rabbitmq.username=${USER_RABBIT:guest}
spring.rabbitmq.password=${PASSWORD_RABBIT:guest}

# Common Config
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# Metrics / Actuator
management.metrics.export.prometheus.enabled=true
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.prometheus.enabled=true
management.endpoint.health.enabled=true
management.health.defaults.enabled=true

# Logging
logging.level.org.springframework.web=INFO
logging.level.keysson=DEBUG
