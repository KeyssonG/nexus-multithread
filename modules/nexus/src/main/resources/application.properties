# Import local configuration if available
spring.config.import=optional:application-local.properties

server.port=8085

# Common Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/managerPROD}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgresql}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT Config
jwt.secret=${SECRET_KEY}

# Common RabbitMQ
spring.rabbitmq.host=${HOST_RABBIT:localhost}
spring.rabbitmq.port=${PORT_RABBIT:5672}
spring.rabbitmq.username=${USER_RABBIT:guest}
spring.rabbitmq.password=${PASSWORD_RABBIT:guest}

# Common Redis
spring.data.redis.host=${HOST_REDIS:localhost}
spring.data.redis.port=${PORT_REDIS:6379}

# Common Config
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# Logging (controlado por logback-spring.xml)

# Desabilita a geracao automatica de senha do Spring Security (warning desnecessario)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# Compression (GZip)
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain
server.compression.min-response-size=1024

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.pool-name=nexus-hikari-pool
spring.datasource.hikari.auto-commit=false

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# Startup logging
logging.level.keysson.nexus=INFO
