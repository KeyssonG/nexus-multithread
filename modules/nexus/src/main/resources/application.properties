# Keycloak Config
keycloak.server-url=${KEYCLOAK_SERVER_URL:http://keycloak.keycloak.svc.cluster.local:8080}
keycloak.realm=${KEYCLOAK_REALM:multithread}
keycloak.admin-client-id=${KEYCLOAK_ADMIN_CLIENT_ID:nexus-api}
keycloak.admin-secret=${KEYCLOAK_CLIENT_SECRET:}
keycloak.gestao-client-id=${KEYCLOAK_GESTAO_CLIENT_ID:multithread-gestao}
keycloak.portal-client-id=${KEYCLOAK_PORTAL_CLIENT_ID:multithread-portal}
